<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Stargazers log</h1>
    <p>A log of the repositories I've starred.</p>
    <section aria-labelledby="starred-heading">
      <h2 id="starred-heading">Starred repositories</h2>
      <p id="starred-empty" class="empty">Loading…</p>
      <ul id="starred" class="starred-list" aria-live="polite"></ul>
    </section>
    <script src="script.js"></script>
  </body>
</html>
